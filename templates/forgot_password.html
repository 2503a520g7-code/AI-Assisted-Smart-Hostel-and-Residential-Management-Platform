<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — AIAC Smart Hostel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🔑</div>
      <h2>Reset Password</h2>
      <p>Securely reset your resident portal password</p>
    </div>

    <div class="auth-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              <span>{{ message }}</span>
              <button type="button" class="close-btn">&times;</button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('forgot_password') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="email">Registered College Email</label>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="name@college.edu" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" class="form-control"
                 placeholder="Min. 8 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                 placeholder="Confirm password" required>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary btn-block" style="padding: 0.75rem;">
            Update & Reset Password
          </button>
        </div>
      </form>
    </div>

    <div class="auth-footer">
      Remembered your password? <a href="{{ url_for('login') }}">Back to login</a>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
